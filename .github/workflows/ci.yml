name: CI

on:
  push:
    branches: ['**']
  pull_request:
    # edited: a changed title or description is checked by the content job.
    types: [opened, synchronize, reopened, edited]

# The guard jobs run on every push so a branch is checked before a pull
# request exists; lint, tests and build run for pull requests and main.

permissions:
  contents: read

jobs:
  identity:
    # Every commit of the range carries GitHub noreply identities only -
    # author, committer, co-authors, sign-offs. Runs on every push and a
    # required check on main. The offending identity is never printed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            # A force-push (rebase) leaves the old head unreachable, so the
            # branch is checked by what it adds over main instead.
            range="origin/main..${{ github.sha }}"
          fi
          python3 tools/check_identity.py --range "$range"

  content:
    # Nothing on the private denylist in any commit of the range (identities,
    # messages, added lines) or in the tree at its head. The list is the
    # secret LEAK_PATTERNS, which a run triggered by a fork or by Dependabot
    # does not get (Dependabot runs see only Dependabot secrets): the check is
    # required for this repository's own commits and passes with a notice
    # otherwise. The pull request's title and body are checked too. A match
    # is reported by place and count, never shown.
    runs-on: ubuntu-latest
    env:
      LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
            [ "${{ github.event.pull_request.head.repo.full_name }}" = "${{ github.repository }}" ] && required=1 || required=0
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            range="${{ github.event.before }}..${{ github.sha }}"
            required=1
          else
            # Same as in the identity job: a rebased branch has no reachable old head.
            range="origin/main..${{ github.sha }}"
            required=1
          fi
          [ "${{ github.actor }}" = "dependabot[bot]" ] && required=0
          [ -n "$LEAK_PATTERNS" ] || unset LEAK_PATTERNS
          LEAK_PATTERNS_REQUIRED=$required python3 tools/check_content.py --range "$range"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" > "$RUNNER_TEMP/pull-request-text"
            LEAK_PATTERNS_REQUIRED=$required python3 tools/check_content.py "$RUNNER_TEMP/pull-request-text"
          fi

  lint:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uvx pre-commit run --all-files --show-diff-on-failure
        env:
          # The denylist hook needs the private list, which only the content
          # job has; without one it refuses, so that job covers it instead.
          SKIP: content
      - name: Vendored parts match their pinned upstream except the listed changes
        run: python3 tools/vendor_diff.py
      - name: The configuration page matches the serve parser
        run: python3 tools/gen_config_reference.py --check
      - name: The core never imports the vision package
        # The contract names both packages, so both must be importable.
        run: |
          uv sync --extra dev --extra vision
          uv run lint-imports

  site:
    # The site is deployed from main only; a dependency bump that breaks
    # the build must show up in the pull request, not after the merge.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: docs/site
      - run: npm run build
        working-directory: docs/site

  test-apple-silicon:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    # macos-15 runners are Apple silicon (M-series): real MLX, tiny models.
    runs-on: macos-15
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # hatch-vcs needs the tags
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --extra dev --extra vision
      - run: uv run python -c "import mlx.core as mx; print(mx.__version__, mx.default_device())"
      - run: uv run beam --version
      - run: uv run beam doctor --json
      - run: uv run pytest -q
      - run: uv run pytest -q packages/mlx-beam-vision/tests

  test-linux:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    # No MLX here: packaging, CLI and the tests that do not need the device.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra vision
      - run: uv run beam --version
      - run: uv run pytest -q
      - run: uv run pytest -q packages/mlx-beam-vision/tests

  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv build
      - run: uv build --package mlx-beam-vision
      - run: ls -l dist/
