name: Release

# Publishes to PyPI through Trusted Publishing (no token in the repo).
#   - a tag v* (v0.2.0, v0.2.0rc1, v0.2.0a1): the tagged commit must be on
#     main; the tests run again on Apple silicon before anything is uploaded.
#   - workflow_dispatch on main: a .dev build of the current main
#     (0.y.0.devN, N = commits since the last tag) for a lab test.
# Installers skip pre-releases unless asked. The `pypi` environment can add
# a required reviewer in the repository settings.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The commit must be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_SHA is not on main"; exit 1; }
      - name: A dispatch must run on main itself
        if: github.event_name == 'workflow_dispatch'
        run: |
          test "$GITHUB_REF_NAME" = "main" \
            || { echo "::error::.dev builds are published from main only, not $GITHUB_REF_NAME"; exit 1; }

  test:
    needs: verify
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev
      - run: uvx pre-commit run --all-files
      - run: uv run beam doctor --json
      - run: uv run pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: ls -l dist/
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
