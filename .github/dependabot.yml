# Actions and the two Python packages, weekly. Python dependencies carry a
# major cap in pyproject (`transformers>=5.7,<6`); with
# `increase-if-necessary` a pull request comes only when a release falls
# outside such a range (pip knows no `widen`; Dependabot refused it).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
  - package-ecosystem: pip
    directory: /packages/mlx-beam-vision
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
