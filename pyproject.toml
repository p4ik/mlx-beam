[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "mlx-beam"
dynamic = ["version"]
description = "Light and modular inference engine, built on MLX."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
authors = [{ name = "the mlx-beam contributors" }]
keywords = ["mlx", "apple-silicon", "llm", "inference", "moe"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "mlx>=0.32; sys_platform == 'darwin'",
  # Carried by the vendored mlx-lm (tokenizers, chat templates, tool parsers).
  "transformers>=5.7,<6",
  "huggingface_hub",
  "jinja2",
  "numpy",
  "regex",
  "sentencepiece",
  "protobuf",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pre-commit>=4",
  "import-linter>=2",
  # CPU build of MLX so the tests run on Linux too (Apple silicon stays the reference).
  "mlx[cpu]>=0.32; sys_platform == 'linux'",
]
# The extra is the installation selector for the package that serves images
# (packages/mlx-beam-vision in this repository, its own project on PyPI).
# The core never imports it: it is found through the entry-point group
# mlx_beam.modalities.
vision = ["mlx-beam-vision"]

[project.scripts]
beam = "mlx_beam.cli:main"

[project.urls]
Homepage = "https://p4ik.github.io/mlx-beam/"
Repository = "https://github.com/p4ik/mlx-beam"
Changelog = "https://github.com/p4ik/mlx-beam/blob/main/CHANGELOG.md"
Issues = "https://github.com/p4ik/mlx-beam/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# PyPI refuses local labels (+g<hash>); .dev builds from main must be uploadable.
local_scheme = "no-local-version"
# An untagged commit counts towards the release it is heading for: after
# v0.1.0a4 the tree is 0.1.0a5.devN, after v0.1.0rc1 0.1.0rc2.devN, after
# v0.1.0 0.1.1.devN (measured 2026-09-25 with setuptools-scm's meta()). The
# release-branch-semver scheme used before jumped to 0.2.0.devN after every tag.
version_scheme = "guess-next-dev"

[tool.hatch.build.hooks.vcs]
version-file = "mlx_beam/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["mlx_beam"]

[tool.hatch.build.targets.sdist]
only-include = ["mlx_beam", "tests", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["mlx_beam/_vendor", "packages/*/*/_vendor", "**/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["exactness: bit-exact comparisons on tiny models (Apple silicon only)"]

# One workspace: the core and the packages beside it are developed and
# tested together; on PyPI each is its own project.
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
mlx-beam-vision = { workspace = true }

# The boundary the extra promises: the core knows no tower. Checked in CI.
[tool.importlinter]
root_packages = ["mlx_beam", "mlx_beam_vision"]

[[tool.importlinter.contracts]]
name = "the core never imports the vision package"
type = "forbidden"
source_modules = ["mlx_beam"]
forbidden_modules = ["mlx_beam_vision"]
