# Vendored parts: what tools/vendor_diff.py compares against. VENDORED.md
# carries the prose (why, what changed); this file carries the coordinates.

[parts.mlx-lm]
repo = "https://github.com/ml-explore/mlx-lm"
commit = "dcbcf786c0cf56f9a12fabe9468c887781431ae2"
upstream_subdir = "mlx_lm"
dest = "mlx_beam/_vendor/mlx_lm"
# Files and directories taken from upstream_subdir; everything else stays out.
include = [
  "generate.py",
  "generate_utils.py",
  "sample_utils.py",
  "tokenizer_utils.py",
  "utils.py",
  "py.typed",
  "models",
  "tool_parsers",
  "chat_templates",
]
# Files under dest that are ours, not upstream's (never diffed).
local = ["__init__.py", "LICENSE", "models/granite4_vision.py"]
# Upstream files we changed on purpose; a diff anywhere else is an error.
modified = [
  "generate.py",
  "models/base.py",
  "models/cache.py",
  "models/qwen3_5.py",
  "models/qwen3_next.py",
  "models/granitemoehybrid.py",
  "utils.py",
  "tokenizer_utils.py",
  "models/plamo2.py",
  "tool_parsers/qwen3_coder.py",
  "tool_parsers/mistral.py",
  "models/muse_glimmer.py",
  "models/granite.py",
  "models/qwen3.py",
  "models/qwen3_moe.py",
]

[parts.optiq]
# No public source repository; the PyPI wheel is the upstream.
wheel = "https://files.pythonhosted.org/packages/b6/c4/4845ba173600125316e8b63a818e910ea4678acf1e1a016d48aa9938a646/mlx_optiq-0.5.6-py3-none-any.whl"
sha256 = "3b94d235a1cf52136f6ef8ace025643d032edd0b4658ba62f0d29fd05592c7c1"
version = "0.5.6"
upstream_subdir = "optiq"
dest = "mlx_beam/_vendor/optiq"
local = ["__init__.py", "LICENSE"]
# Both files are ports (new cache API, installers removed), so both are modified.
modified = ["kv_batch.py", "fused_quant_sdpa.py"]

# dest file = upstream file
[parts.optiq.files]
"kv_batch.py" = "runtime/kv/batch.py"
"fused_quant_sdpa.py" = "runtime/fused_quant_sdpa.py"

[parts.mlx-vlm]
# The exact-verify kernels only; the PyPI wheel is the upstream.
wheel = "https://files.pythonhosted.org/packages/ae/fc/7fbd894db247582bfa16df9b0b7514a47e9c3971836fc8d3fbd9f6efdbe8/mlx_vlm-0.7.1-py3-none-any.whl"
sha256 = "d9696bc3a2e961f43b5948a101dc0c966b5989d382e6910c37e2f3d555bc3408"
version = "0.7.1"
upstream_subdir = "mlx_vlm"
dest = "mlx_beam/_vendor/mlx_vlm"
local = ["__init__.py", "LICENSE"]
# The switch-layer import points at the vendored mlx-lm.
modified = ["quantized_verifier.py"]

# dest file = upstream file
[parts.mlx-vlm.files]
"quantized_verifier.py" = "models/quantized_verifier.py"
"exact_speculative_verify.py" = "models/exact_speculative_verify.py"

[parts.mlx-vlm-vision]
# The towers of the vision package, from the same wheel.
wheel = "https://files.pythonhosted.org/packages/ae/fc/7fbd894db247582bfa16df9b0b7514a47e9c3971836fc8d3fbd9f6efdbe8/mlx_vlm-0.7.1-py3-none-any.whl"
sha256 = "d9696bc3a2e961f43b5948a101dc0c966b5989d382e6910c37e2f3d555bc3408"
version = "0.7.1"
upstream_subdir = "mlx_vlm"
dest = "packages/mlx-beam-vision/mlx_beam_vision/_vendor/mlx_vlm"
local = [
  "__init__.py",
  "LICENSE",
  "qwen3_vl/__init__.py",
  "pixtral/__init__.py",
  "gemma4/__init__.py",
  "muse_glimmer/__init__.py",
  "granite4_vision/__init__.py",
]
# base.py holds two pieces of upstream's models/base.py, nothing else.
modified = ["base.py"]

[parts.mlx-vlm-vision.files]
"base.py" = "models/base.py"
"qwen3_vl/vision.py" = "models/qwen3_vl/vision.py"
"qwen3_vl/config.py" = "models/qwen3_vl/config.py"
"pixtral/vision.py" = "models/pixtral/vision.py"
"pixtral/config.py" = "models/pixtral/config.py"
"gemma4/vision.py" = "models/gemma4/vision.py"
"gemma4/config.py" = "models/gemma4/config.py"
"muse_glimmer/vision.py" = "models/muse_glimmer/vision.py"
"muse_glimmer/config.py" = "models/muse_glimmer/config.py"
"granite4_vision/vision.py" = "models/granite4_vision/vision.py"
"granite4_vision/config.py" = "models/granite4_vision/config.py"
"granite4_vision/downsampling.py" = "models/granite4_vision/downsampling.py"
"granite4_vision/qformer.py" = "models/granite4_vision/qformer.py"
