repos:
-   repo: https://github.com/psf/black-pre-commit-mirror
    rev: 25.1.0
    hooks:
    -   id: black
        exclude: ^(mlx_beam/_vendor/|packages/.*/_vendor/|.*/_version\.py$)
-   repo: https://github.com/pycqa/isort
    rev: 6.0.0
    hooks:
    -   id: isort
        args:
            - --profile=black
        exclude: ^(mlx_beam/_vendor/|packages/.*/_vendor/|.*/_version\.py$)
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
    -   id: ruff-check
-   repo: local
    hooks:
    -   id: identity
        name: commit identity is a GitHub noreply address
        entry: python3 tools/check_identity.py
        language: system
        stages: [commit-msg]
        always_run: true
        pass_filenames: true
    -   id: content
        name: nothing on the denylist in the staged files
        entry: python3 tools/check_content.py
        language: system
        pass_filenames: true
    -   id: content-msg
        name: nothing on the denylist in the message or identity
        entry: python3 tools/check_content.py --msg
        language: system
        stages: [commit-msg]
        always_run: true
        pass_filenames: true
